services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: ne_valhalla
    ports: ["8002:8002"]
    volumes:
      - ./data/valhalla:/custom_files
    environment:
      - use_tiles_ignore_pbf=True      # reuse built tiles on restart
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True          # needed for date_time / time-dependent rules
      - server_threads=2
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    container_name: ne_db
    environment:
      POSTGRES_DB: noentry
      POSTGRES_USER: noentry
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports: ["5433:5432"]
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped

  api:
    build: ./backend
    container_name: ne_api
    environment:
      DATABASE_URL: postgresql://noentry:${DB_PASSWORD:-change_me}@db:5432/noentry
      VALHALLA_URL: http://valhalla:8002
    depends_on: [db, valhalla]
    ports: ["8000:8000"]
    restart: unless-stopped

  # Optional: public HTTPS URL for the phone. Run with: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [api]
    restart: unless-stopped
