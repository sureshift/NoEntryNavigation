name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ["feed/**", ".github/workflows/update-feed.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 1. Offline Delhi map data (roads, places) ----------
      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium
      - name: Cache Delhi extract
        uses: actions/cache@v4
        with:
          path: data/delhi.osm.pbf
          key: ncr-extract-v3
      - name: Fetch Delhi OSM extract (tries several mirrors)
        run: bash tools/fetch_osm.sh
      - name: Fetch Overture Maps places (extra businesses; optional)
        continue-on-error: true
        run: |
          pip install duckdb
          python tools/fetch_overture.py data/overture_places.csv
      - name: Build offline database
        run: python tools/build_data.py data/delhi.osm.pbf android/app/src/main/assets/delhi.db data/overture_places.csv

      - name: Check gazette rules against the map
        run: python tools/check_rules.py android/app/src/main/assets/rules.json android/app/src/main/assets/delhi.db

      # ---------- 2. Android app ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Community reports config (from repository secrets)
        env:
          COMMUNITY_URL: ${{ secrets.COMMUNITY_URL }}
          COMMUNITY_SECRET: ${{ secrets.COMMUNITY_SECRET }}
        run: python3 tools/community_server/make_config.py

      - name: Signing key from repository secrets (optional; falls back to the key in android/signing)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/routiq.jks"; echo "KS_FILE=$RUNNER_TEMP/routiq.jks" >> $GITHUB_ENV; fi
      - name: Build release APK (signed)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Check the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ROUTIQ.apk
          ls -l ROUTIQ.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose ROUTIQ.apk | head -5
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt2 dump badging ROUTIQ.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: NoEntryNav-apk
          path: ROUTIQ.apk
      - name: Publish as release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ROUTIQ build ${{ github.run_number }}
          files: ROUTIQ.apk
