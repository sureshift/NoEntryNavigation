name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ["feed/**", ".github/workflows/update-feed.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 1. Offline Delhi map data (roads, places) ----------
      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium
      - name: Cache Delhi extract
        uses: actions/cache@v4
        with:
          path: data/delhi.osm.pbf
          key: delhi-extract-v1
      - name: Fetch Delhi OSM extract (tries several mirrors)
        run: bash tools/fetch_osm.sh
      - name: Build offline database
        run: python tools/build_data.py data/delhi.osm.pbf android/app/src/main/assets/delhi.db

      - name: Check gazette rules against the map
        run: python tools/check_rules.py android/app/src/main/assets/rules.json android/app/src/main/assets/delhi.db

      # ---------- 2. Android app ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NoEntryNav-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish as release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NoEntry Nav build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
